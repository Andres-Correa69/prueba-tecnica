# Perfil por defecto: valores razonables que permiten al servicio arrancar sin ninguna
# variable de entorno (útil para `./gradlew test`). Los despliegues reales lo sobreescriben vía
# application-dev.yml + variables de entorno.
spring:
  application:
    name: auth-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
      # Respetar los nombres exactos de @Table/@Column (ej. "Users", "password_hash")
      # en vez de convertirlos a snake_case. Evita "missing table auth.users".
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Hibernate 6 por default mapea Instant → TIMESTAMP_UTC (DATETIMEOFFSET en SQL Server).
        # Nuestras columnas son DATETIME2(3), así que forzamos el mapeo TIMESTAMP clásico.
        type.preferred_instant_jdbc_type: TIMESTAMP

server:
  port: 8081

app:
  cors:
    # Origen del dev server de Angular (`ng serve`). El puerto 4200 es el
    # default del Angular CLI; si lo cambias en `angular.json` actualiza
    # también este valor (o define la env var `APP_CORS_ALLOWED_ORIGINS`).
    allowed-origins: http://localhost:4200

security:
  jwt:
    # 32+ bytes ASCII — sobreescribir en ejecuciones reales con JWT_SECRET
    secret: ${JWT_SECRET:dev-default-secret-must-be-32-chars!}
    issuer: ufinet-autos
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health
