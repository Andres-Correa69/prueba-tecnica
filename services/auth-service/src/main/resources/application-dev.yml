# Perfil dev: se conecta al contenedor SQL Edge dentro de la VM Multipass.
# Variables de entorno requeridas:
#   SQL_HOST      — IP de la VM (por ejemplo `multipass info close-bluebill | awk '/IPv4/ {print $2; exit}'`)
#   SQL_PASSWORD  — contraseña de SA
#   JWT_SECRET    — secreto HMAC de 32 bytes compartido con cars-service
spring:
  datasource:
    url: jdbc:sqlserver://${SQL_HOST}:1433;databaseName=ufinet_autos;encrypt=false;trustServerCertificate=true
    username: sa
    password: ${SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false
