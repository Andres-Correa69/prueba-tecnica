spring:
  application:
    name: cars-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
      # Respetar los nombres exactos de @Table/@Column (ej. "Cars", "user_id", "foto_url")
      # en vez de convertirlos a snake_case. Evita "missing table cars.cars".
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Hibernate 6 por default mapea Instant → TIMESTAMP_UTC (DATETIMEOFFSET en SQL Server).
        # Nuestras columnas son DATETIME2(3), así que forzamos el mapeo TIMESTAMP clásico.
        type.preferred_instant_jdbc_type: TIMESTAMP

server:
  port: 8082

app:
  cors:
    # Origen del dev server de Angular (`ng serve`). El puerto 4200 es el
    # default del Angular CLI; si lo cambias en `angular.json` actualiza
    # también este valor (o define la env var `APP_CORS_ALLOWED_ORIGINS`).
    allowed-origins: http://localhost:4200

security:
  jwt:
    secret: ${JWT_SECRET:dev-default-secret-must-be-32-chars!}
    issuer: ufinet-autos

management:
  endpoints:
    web:
      exposure:
        include: health
